name: Toxicgram original-client development build
on:
  workflow_dispatch:
  push:
    branches: [original-client]
    paths:
      - 'TMessagesProj/**'
      - 'TMessagesProj_AppStandalone/**'
      - 'gradle.properties'
      - 'scripts/toxicgram-original-build.py'
      - '.github/workflows/toxicgram-original.yml'
permissions:
  contents: read
concurrency:
  group: toxicgram-original
  cancel-in-progress: true
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018 cmake;3.22.1'
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare isolated development identity
        run: |
          python3 scripts/toxicgram-original-build.py
          rm -f TMessagesProj/config/release.keystore
          keytool -genkeypair -keystore TMessagesProj/config/release.keystore -storepass android -keypass android -alias androidkey -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Toxicgram Development"
      - name: Configure Maven Central mirror for Gradle
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/toxicgram-central.gradle" <<'EOF'
          import org.gradle.api.artifacts.repositories.MavenArtifactRepository
          def centralMirror = 'https://maven-central.storage-download.googleapis.com/maven2/'
          def redirectCentral = { repositories ->
              repositories.withType(MavenArtifactRepository).configureEach { repo ->
                  if (repo.url?.host in ['repo.maven.apache.org', 'repo1.maven.org']) {
                      repo.url = URI.create(centralMirror)
                  }
              }
          }
          gradle.beforeSettings { settings ->
              settings.pluginManagement.repositories {
                  maven { url = URI.create(centralMirror) }
                  gradlePluginPortal()
              }
              redirectCentral(settings.pluginManagement.repositories)
              redirectCentral(settings.dependencyResolutionManagement.repositories)
          }
          gradle.beforeProject { project ->
              redirectCentral(project.buildscript.repositories)
              redirectCentral(project.repositories)
          }
          EOF
      - name: Compile original Telegram Android sources
        run: bash gradlew :TMessagesProj_AppStandalone:assembleAfatDebug --no-daemon --stacktrace --max-workers=2
      - name: Confirm APK output
        run: |
          find TMessagesProj_AppStandalone/build/outputs/apk -type f -name '*.apk' -print
          test -n "$(find TMessagesProj_AppStandalone/build/outputs/apk -type f -name '*.apk' -print -quit)"
      - name: Upload experimental Toxicgram APK
        uses: actions/upload-artifact@v4
        with:
          name: Toxicgram-original-dev-APK
          path: TMessagesProj_AppStandalone/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

# Rebuild the full original-client development APK on request.
