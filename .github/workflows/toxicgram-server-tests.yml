name: Toxicgram server tests
on:
  workflow_dispatch:
  push:
    paths:
      - 'toxicgram-server/**'
      - '.github/workflows/toxicgram-server-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: toxicgram-server
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: toxicgram-server
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt httpx
      - run: python -m unittest -v test_messaging
